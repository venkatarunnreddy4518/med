[project]
name = "medico-ai"
version = "1.0.0"
description = "FastAPI backend for Medico.AI"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.110,<1",
    "pandas>=2.2,<3",
    "pillow>=10,<13",
    "pydantic>=2.7,<3",
    "python-multipart>=0.0.9,<1",
    "rapidfuzz>=3.9,<4",
    "requests>=2.31,<3",
    "sqlalchemy>=2.0,<3",
]

[tool.vercel]
entrypoint = "backend.app:app"
